name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  checks:
    name: Check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: make venv

      - name: Run checks
        run: make check DOCKER_ENV=.env.docker.example

      - name: Run tests
        run: make test DOCKER_ENV=.env.docker.example

      - name: Validate Docker Compose config
        run: |
          DJANGO_ENV_FILE=.env.docker.example docker compose --env-file .env.docker.example config --quiet
          DJANGO_ENV_FILE=.env.prod.example docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod.example config --quiet

      - name: Show Docker logs on failure
        if: failure()
        run: DJANGO_ENV_FILE=.env.docker.example docker compose --env-file .env.docker.example logs
