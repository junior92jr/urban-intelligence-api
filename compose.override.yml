services:
  web:
    build:
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      target: development
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    volumes:
      - .:/app

  db:
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    ports:
      - "5433:5432"
