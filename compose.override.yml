services:
  web:
    build:
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      target: development
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    volumes:
      - .:/app
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-city-guide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-city-guide-minio-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${OBJECT_STORAGE_BUCKET}"
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-city-guide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-city-guide-minio-dev}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-city-guide-data}
    networks:
      - backend

  db:
    env_file:
      - ${DJANGO_ENV_FILE:-.env.docker}
    ports:
      - "5433:5432"

volumes:
  minio_data:
