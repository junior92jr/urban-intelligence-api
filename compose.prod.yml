services:
  web:
    build:
      target: production
    env_file:
      - ${DJANGO_ENV_FILE:-.env.prod}
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s

  worker:
    build:
      target: production
    env_file:
      - ${DJANGO_ENV_FILE:-.env.prod}
    restart: unless-stopped
    stop_grace_period: 45s

  nginx:
    image: nginx:1.31-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    env_file:
      - ${DJANGO_ENV_FILE:-.env.prod}
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  staticfiles:

networks:
  frontend:
