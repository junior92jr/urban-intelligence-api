{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}City Guide{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'web/styles.css' %}">
    {% block styles %}{% endblock %}
  </head>
  <body class="{% block body_class %}site-page{% endblock %}">
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
