{% extends "web/base.html" %}

{% block title %}Forgot Password - City Guide{% endblock %}

{% block body %}
<main class="auth-page">
  <div class="auth-layout">
    <section class="auth-hero" aria-labelledby="forgot-password-title">
      <div class="brand-mark" aria-hidden="true">CG</div>
      <p class="eyebrow">City Guide</p>
      <h1 id="forgot-password-title">Forgot password</h1>
      <p>Enter your email and we will send a password reset link if the account exists.</p>
    </section>
    <section class="auth-panel" aria-label="Forgot password form">
      <form class="auth-form" method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="field">
          <span>Email</span>
          {{ form.email }}
        </label>
        <button class="primary-button" type="submit">Send reset link</button>
      </form>
      <div class="auth-links">
        <a href="{% url 'web:login' %}">Back to sign in</a>
      </div>
    </section>
  </div>
</main>
{% endblock %}
