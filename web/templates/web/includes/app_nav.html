<nav class="app-rail" aria-label="Main navigation">
  <button
    class="rail-toggle"
    type="button"
    aria-label="Collapse navigation"
    aria-expanded="true"
    title="Collapse navigation"
  >
    <svg class="rail-toggle-icon rail-toggle-icon--collapse" aria-hidden="true" viewBox="0 0 24 24">
      <rect width="18" height="18" x="3" y="3" rx="2"></rect>
      <path d="M9 3v18"></path>
      <path d="m16 15-3-3 3-3"></path>
    </svg>
    <svg class="rail-toggle-icon rail-toggle-icon--expand" aria-hidden="true" viewBox="0 0 24 24">
      <rect width="18" height="18" x="3" y="3" rx="2"></rect>
      <path d="M9 3v18"></path>
      <path d="m13 9 3 3-3 3"></path>
    </svg>
  </button>
  <a class="rail-link {% if active_nav == 'map' %}rail-link--active{% endif %}" href="{% url 'web:map' %}" aria-label="Map" title="Map">
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3Z"></path>
      <path d="M9 3v15"></path>
      <path d="M15 6v15"></path>
    </svg>
    <span>Map</span>
  </a>
  <a class="rail-link {% if active_nav == 'favorites' %}rail-link--active{% endif %}" href="{% url 'web:favorites' %}" aria-label="Favorites" title="Favorites">
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path>
    </svg>
    <span>Favorites</span>
  </a>
  <a class="rail-link {% if active_nav == 'history' %}rail-link--active{% endif %}" href="{% url 'web:history' %}" aria-label="History" title="History">
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 1 0 3-6.7"></path>
      <path d="M3 3v6h6"></path>
      <path d="M12 7v5l3 2"></path>
    </svg>
    <span>History</span>
  </a>
  <a class="rail-link {% if active_nav == 'profile' %}rail-link--active{% endif %}" href="{% url 'web:profile' %}" aria-label="Profile" title="Profile">
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="M20 21a8 8 0 0 0-16 0"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span>Profile</span>
  </a>
  <div class="rail-spacer" aria-hidden="true"></div>
  <form class="rail-form" method="post" action="{% url 'web:logout' %}">
    {% csrf_token %}
    <button class="rail-link rail-action" type="submit" aria-label="Sign out" title="Sign out">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <path d="M16 17l5-5-5-5"></path>
        <path d="M21 12H9"></path>
      </svg>
      <span>Sign out</span>
    </button>
  </form>
</nav>
